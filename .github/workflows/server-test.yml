name: Server tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zhiya
          POSTGRES_PASSWORD: zhiya-local
          POSTGRES_DB: zhiya
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U zhiya -d zhiya"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.6
        env:
          RUSTFS_ACCESS_KEY: zhiya-local-access
          RUSTFS_SECRET_KEY: zhiya-local-secret-change-before-deploy
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget --quiet --spider http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Run server tests
        env:
          ZHIYA_TEST_DATABASE: "1"
        run: go -C apps/server test -race ./...
