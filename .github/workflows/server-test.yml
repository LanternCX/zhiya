name: Server tests

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: zhiya
          POSTGRES_PASSWORD: zhiya-local
          POSTGRES_DB: zhiya
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U zhiya -d zhiya"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.6
        env:
          RUSTFS_ACCESS_KEY: zhiya-local-access
          RUSTFS_SECRET_KEY: zhiya-local-secret-change-before-deploy
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:1420
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget --quiet --spider http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Run server tests
        env:
          ZHIYA_TEST_DATABASE: "1"
          ZHIYA_KNOWLEDGE_TEST_URL: "postgres://zhiya:zhiya-local@127.0.0.1:54329/postgres?sslmode=disable"
        run: go -C apps/server test -race ./...
