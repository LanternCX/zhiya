name: Website tests

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Website tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build the website
        run: npm run build:website
      - name: Check release scripts
        run: node --test scripts/release.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run website tests
        run: npm run test:website
      - name: Run GitHub Pages tests
        run: npm run test:website:pages
      - name: Repeat navigation, loading and animation regressions
        working-directory: apps/website
        run: npx playwright test --config playwright.pages.config.ts --grep 'late .* loading|hero controls|supports keyboard focus|switching classroom scenes|scroll-driven slides' --repeat-each=5
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 7
