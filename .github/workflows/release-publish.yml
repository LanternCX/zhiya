name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag to build or retry
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-installers-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
      - name: Verify publication, CI and production configuration
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          API_ORIGIN: ${{ vars.ZHIYA_API_ORIGIN }}
        run: |
          version=$(node scripts/release.mjs validate "$RELEASE_TAG" "$API_ORIGIN")
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          gh run list --workflow release-draft.yml --commit "$sha" --event push --limit 100 --json conclusion,headBranch | jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .conclusion == "success" and .headBranch == $tag)'
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundle: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundle: app,dmg
    env:
      ZHIYA_CLIENT_API_ORIGIN: ${{ vars.ZHIYA_API_ORIGIN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install the Rust target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Build the installer
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
        run: npm run build:desktop -- --target "$RUST_TARGET" --bundles "$BUNDLE" --config "{\"version\":\"$RELEASE_VERSION\"}" -- --locked
      - name: Verify the macOS application signature
        if: runner.os == 'macOS'
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: codesign --verify --deep --strict "apps/client/src-tauri/target/$RUST_TARGET/release/bundle/macos/Zhiya.app"
      - name: Collect the installer
        env:
          RUST_TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/release.mjs collect "$RELEASE_TAG" "apps/client/src-tauri/target/$RUST_TARGET/release/bundle" dist/installers "$PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.platform }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist/installers
      - name: Assemble and upload complete downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/release.mjs assemble "$RELEASE_TAG" dist/installers dist/metadata
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release upload "$RELEASE_TAG" dist/installers/* dist/metadata/SHA256SUMS.txt --clobber
          gh release upload "$RELEASE_TAG" dist/metadata/downloads.json --clobber
