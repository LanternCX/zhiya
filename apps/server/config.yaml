# Deployment configuration. Paths are relative to this file.
# Override a field with ZHIYA_SERVER_<SECTION>_<KEY>.
development: true

# Private TypeScript runtime and Go tool API. Supply the same secret to both services.
agent:
  endpoint: "http://127.0.0.1:8082"
  internal_listen: "127.0.0.1:8081"
  secret: ""

# OpenAI-compatible Chat Completions endpoint, including /v1/chat/completions.
# Leave empty to run account services without a model. Never put live keys here.
model:
  endpoint: ""
  id: ""
  api_key: ""

# DashScope realtime speech relay. Keep live credentials in environment variables.
speech:
  endpoint: "wss://dashscope.aliyuncs.com/api-ws/v1/inference"
  asr_api_key: ""
  tts_api_key: ""
  asr_model: "qwen-audio-3.0-asr-flash-streaming"
  tts_model: "qwen3-tts-flash-realtime"
  tts_voice: "Cherry"
# Native image-generation API base URL.
# Keep the API key in config.local.yaml or an environment variable.
image_model:
  endpoint: "https://maas.qianwenaiapi.com/api/v1"
  id: "qwen-image-3.0"
  api_key: ""

# Private fixed document converter; development binds it to loopback.
material_parser:
  endpoint: "http://127.0.0.1:8090"

# Official Beijing Image-to-Text API, used only by the material parsing worker.
# Use an account-specific Beijing endpoint if required by your Model Studio workspace.
vision_model:
  endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  id: "qwen3-vl-plus"
  api_key: ""

# The code runner is only reached by the Go server. Development binds it to loopback.
runner:
  endpoint: "http://127.0.0.1:2358"

# Logs go to stderr. Use JSON when the deployment platform collects logs.
logging:
  level: "info"
  format: "text"

http:
  listen: "127.0.0.1:8080"
  origin: "http://127.0.0.1:1420"
  web_dir: "../client/dist"
  startup_timeout_seconds: 15
  shutdown_timeout_seconds: 5
  read_header_timeout_seconds: 5
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  idle_timeout_seconds: 60
  request_timeout_seconds: 20
  cleanup_interval_seconds: 60
  max_body_bytes: 3145728

# These credentials are for the loopback development database only.
# Supply production credentials through the deployment environment.
database:
  url: "postgres://zhiya:zhiya-local@127.0.0.1:54329/zhiya?sslmode=disable"

# Local S3-compatible RustFS. Override credentials for every non-development deployment.
storage:
  endpoint: "http://127.0.0.1:9000"
  public_endpoint: "http://127.0.0.1:9000"
  region: "us-east-1"
  bucket: "zhiya-materials"
  access_key: "zhiya-local-access"
  secret_key: "zhiya-local-secret-change-before-deploy"
  url_ttl_seconds: 120

smtp:
  address: "127.0.0.1:1025"
  from: "Zhiya <noreply@zhiya.local>"
  username: ""
  password: ""
  timeout_seconds: 10

# Operational limits. Durations are in seconds; counts apply per rate window.
account:
  session_ttl_seconds: 2592000
  verification_attempts: 5
  rate_window_seconds: 60
  ip_limit: 60
  mail_limit: 5
  login_limit: 10
  email_change_limit: 5
